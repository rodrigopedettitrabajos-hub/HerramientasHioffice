# Cada cambio en main que toque fuentes/ arma el .exe y lo publica como versión nueva.
# El programa instalado la ve y ofrece "↻ Reiniciar y actualizar".
name: Publicar versión
on:
  push:
    branches: [main]
    paths: ['fuentes/**', '.github/workflows/publicar.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: fuentes/src/goapp/go.mod
          cache-dependency-path: fuentes/src/goapp/go.sum
      - name: Probar
        run: |
          cd fuentes && node build.js . && node --test tests/prueba_csv.js
          cd src/goapp && go test ./...
      - name: Compilar y publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="1.$(printf %02d ${{ github.run_number }})"   # 1.03, 1.04…
          cd fuentes/src/goapp
          # Ícono del .exe (cuadrado rojo con H): recurso de Windows armado en cada publicación, no se guarda en el repo
          go run github.com/akavel/rsrc@v0.10.2 -ico icono.ico -arch amd64 -o rsrc_windows_amd64.syso
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$TAG" -o Herramientas_HiOffice.exe .
          # Novedades = mensaje del commit sin las líneas de firma
          git log -1 --format=%B | grep -vE '^(Co-[Aa]uthored-[Bb]y:|Claude-Session:|-{3,}\s*$)' > notas.txt
          gh release create "$TAG" Herramientas_HiOffice.exe ../../dist/Herramientas_HiOffice.html --title "$TAG" --notes-file notas.txt
